<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SomaOS Brain Robot Console</title>
<style>
:root{--bg:#050814;--p1:#0b1324;--p2:#101a2f;--ln:#223253;--tx:#e9efff;--mu:#93a4c7;--ac:#5eead4;--bu:#60a5fa;--wa:#fbbf24;--da:#fb7185}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;background:#050814;color:var(--tx);display:flex}
#left{width:min(420px,32vw);min-width:320px;display:flex;flex-direction:column;border-right:1px solid var(--ln);background:#070d1c}
#center{flex:1;display:flex;flex-direction:column;min-width:300px;background:radial-gradient(900px 500px at 70% -10%,#12234a,#050814)}
#right{width:min(400px,30vw);min-width:310px;border-left:1px solid var(--ln);background:#070d1c;overflow:auto}
header{padding:12px 16px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;background:#081021}
h1{margin:0;font-size:15px}.sub{font-size:11px;color:var(--mu);margin-top:2px}.badge{padding:5px 10px;border-radius:99px;font-size:11px;background:#102036;border:1px solid var(--ln)}
.tabs{display:flex;gap:4px;padding:10px 12px}.tab{flex:1;padding:8px;border-radius:8px;background:#0e172c;border:1px solid var(--ln);color:var(--mu)}.tab.on{background:#173258;color:#fff}
.panel{flex:1;display:none;padding:14px;overflow:auto}.panel.on{display:block}
.chat{height:calc(100vh - 225px);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:#081120;border:1px solid var(--ln);border-radius:12px}
.msg{max-width:88%;padding:8px 10px;border-radius:12px;font-size:12px;line-height:1.45;white-space:pre-wrap}.u{align-self:end;background:#173258}.a{align-self:start;background:#112038}.s{align-self:center;color:var(--mu);background:#152238;font-size:11px}
label{display:block;font-size:11px;color:var(--mu);margin-bottom:3px}input,textarea,select{width:100%;min-height:35px;margin-bottom:8px;background:#081120;border:1px solid var(--ln);color:var(--tx);border-radius:9px;padding:8px;font:inherit}textarea{min-height:72px;resize:vertical}
button{cursor:pointer;border:0;border-radius:9px;padding:9px 10px;background:#223757;color:#fff;font-size:12px;font-weight:650;width:100%}button:hover{filter:brightness(1.13)}button.pri{background:var(--ac);color:#03201b}button.blu{background:var(--bu);color:#04142c}button.war{background:var(--wa);color:#332002}button.dan{background:var(--da);color:#36060f}.row{display:flex;gap:7px}.row>*{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stage{position:relative;flex:1;margin:12px;background:#071020;border:1px solid var(--ln);border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center}
svg{width:min(92%,640px);max-height:92%}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 12px 12px}.m{background:#081120;border:1px solid var(--ln);border-radius:10px;padding:8px;text-align:center}.m b{display:block;font-size:16px}.m small{color:var(--mu);font-size:10px}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:11px;margin:10px}.card h3{margin:0 0 8px;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.09em}
.slider{margin:6px 0}.slider label{display:flex;justify-content:space-between}input[type=range]{padding:0;height:26px;accent-color:var(--ac)}pre{margin:8px 0 0;padding:9px;background:#070d19;border:1px solid var(--ln);border-radius:9px;max-height:170px;overflow:auto;font-size:11px;white-space:pre-wrap}
@media(max-width:1000px){body{flex-direction:column;height:auto;overflow:auto}#left,#right{width:auto;min-width:0;border:0}.chat{height:280px}.stage{height:330px}}
</style>
</head>
<body>
<div id="left">
<header><div><h1>SomaOS Brain Next</h1><div class="sub">对话 · 控制 · 机器人状态</div></div><div class="badge" id="badge">CONNECTING</div></header>
<div class="tabs"><button class="tab on" onclick="tab('chat')">AI 对话控制</button><button class="tab" onclick="tab('api')">接口配置</button></div>
<div id="panel-chat" class="panel on" style="padding:0">
 <div style="padding:12px"><div class="chat" id="chat"></div>
 <input id="chatInput" placeholder="输入：回家 / 抓取红色杯子 / 演示动作 / 前进 / 状态报告" onkeydown="if(event.key==='Enter')sendChat()">
 <div class="row"><button class="pri" onclick="sendChat()">发送并执行</button><button onclick="resetAI()">清空上下文</button></div></div>
</div>
<div id="panel-api" class="panel">
 <div class="card"><h3>AI Provider</h3><label>API Key</label><input id="apiKey" type="password" placeholder="sk-or-v1-..."><label>Local Base URL</label><input id="localBaseUrl" value="http://127.0.0.1:18080/v1"><label>Model ID</label><input id="modelId" value="qwen3-14b-instruct-q4_k_m"><button class="pri" onclick="configureAI()">保存并连接模型</button><pre id="aiOut">未配置</pre></div>
 <div class="card"><h3>安全重置令牌</h3><label>SOMAOS_SAFETY_RESET_TOKEN</label><input id="resetToken" type="password"><button class="war" onclick="resetSafety()">恢复运行</button></div>
</div>
</div>

<div id="center">
<header><div><h1>机器人实时显示</h1><div class="sub">六轴机械臂 · 安全执行 · PointFlow 风险检查</div></div><div class="badge" id="estop">READY</div></header>
<div class="stage"><svg viewBox="-170 -260 340 450" aria-label="robot arm"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><ellipse cx="0" cy="175" rx="130" ry="23" fill="#0e1a33"/><rect x="-95" y="145" width="190" height="30" rx="9" fill="#24385c"/><rect x="-55" y="90" width="110" height="58" rx="10" fill="#2c446c"/><rect x="-42" y="-235" width="84" height="330" rx="36" fill="#0d1830"/><g transform="translate(0,138)">
<g id="j0"><circle r="27" fill="#31517f"/><circle r="10" fill="#67e8f9"/><g transform="translate(0,-22)"><rect x="-17" y="-88" width="34" height="96" rx="14" fill="url(#g)"/>
<g id="j1" transform="translate(0,-82)"><circle r="22" fill="#67e8f9"/><circle r="8" fill="#0c2a44"/><g transform="translate(0,-18)"><rect x="-14" y="-76" width="28" height="86" rx="12" fill="#bae6fd"/>
<g id="j2" transform="translate(0,-68)"><circle r="19" fill="#31517f"/><circle r="7" fill="#93c5fd"/><g transform="translate(0,-16)"><rect x="-12" y="-64" width="24" height="72" rx="10" fill="url(#g)"/>
<g id="j3" transform="translate(0,-56)"><circle r="16" fill="#67e8f9"/><g transform="translate(0,-14)"><rect x="-10" y="-48" width="20" height="54" rx="8" fill="#bae6fd"/>
<g id="j4" transform="translate(0,-42)"><circle r="13" fill="#31517f"/><g transform="translate(0,-12)"><rect x="-8" y="-34" width="16" height="38" rx="7" fill="#93c5fd"/>
<g id="j5" transform="translate(0,-28)"><circle r="11" fill="#67e8f9"/><g transform="translate(0,-10)"><path d="M-16 -4 L-4 -18 M16 -4 L4 -18" stroke="#fb7185" stroke-width="7" stroke-linecap="round"/><circle r="7" fill="#fb7185"/></g></g></g></g></g></g></g></g></g></g></g></g></g></svg></div>
<div class="metrics"><div class="m"><small>HEALTH</small><b id="mh">—</b></div><div class="m"><small>WATCHDOG</small><b id="mw">—</b></div><div class="m"><small>QUEUE</small><b id="mq">0</b></div><div class="m"><small>MODE</small><b id="mm">SAFE</b></div></div>
</div>

<div id="right">
<header><div><h1>手动控制台</h1><div class="sub">每个动作都经过安全过滤</div></div><button class="dan" style="width:auto" onclick="stopAll()">急停</button></header>
<div class="card"><h3>关节控制 J1-J6</h3><div id="sliders"></div>
<label>Velocity rad/s<input id="vel" type="number" step=".05" min=".05" max="1.5" value=".35"></label>
<label>Torque N·m<input id="tor" type="number" step="1" min="1" max="35" value="12"></label>
<div class="grid2"><button class="pri" onclick="sendManual()">执行当前姿态</button><button onclick="homePose()">Home 复位</button></div>
<div class="grid2" style="margin-top:7px"><button class="blu" onclick="demoPose()">演示姿态</button><button onclick="kick()">喂看门狗</button></div></div>
<div class="card"><h3>任务目标</h3><input id="goalText" value="抓取红色杯子"><button class="pri" onclick="runGoal()">安全执行任务</button><pre id="goalOut">ready</pre></div>
<div class="card"><h3>感知输入</h3><textarea id="observeBody">{"modality":"point_cloud","confidence":.92,"points":[[.08,0,0],[1,1,1]],"targetPosition":[0,0,0],"objects":[{"id":"red-cup","label":"red cup","reachable":true,"targetJoints":[.4,-.7,1.1,.2,.3,0]}]}</textarea><button onclick="post('/observe','observeBody','goalOut')">注入点云观察</button></div>
<div class="card"><h3>系统状态</h3><button onclick="refresh(true)">刷新全量状态</button><pre id="statusOut">loading…</pre></div>
</div>
<script>window.CONSOLE_VERSION='2026-08-26-chat-fixed';console.log('SomaOS Console',window.CONSOLE_VERSION);
const $=id=>document.getElementById(id);let joints=[0,-.5,.9,0,0,0];
async function api(p,m='GET',b){try{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});return{ok:r.ok,s:r.status,d:await r.json().catch(()=>({error:'bad response'}))}}catch(e){return{ok:false,s:0,d:{error:String(e)}}}}
function msg(t,c='a'){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('chat').append(d);$('chat').scrollTop=999999;}
function tab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));$('panel-'+id).classList.add('on');document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('on',i===(id==='chat'?0:1)));}
function sliders(){$('sliders').innerHTML=['Base','Shoulder','Elbow','Wrist Roll','Wrist Pitch','Tool'].map((n,i)=>`<div class=slider><label>${n}<span>${joints[i].toFixed(2)}</span></label><input type=range min=-3 max=3 step=.02 value=${joints[i]} oninput=setJ(${i},this.value)></div>`).join('');render();}
function setJ(i,v){joints[i]=+v;render();sliders();}function render(){for(let i=0;i<6;i++)$('j'+i).setAttribute('transform',`rotate(${joints[i]*57.2958})`);}
async function refresh(full){const r=await api('/health');if(!r.ok)return $('badge').textContent='OFFLINE';$('statusOut').textContent=JSON.stringify(r.d,null,2);const h=r.d.health?.healthy;$('badge').textContent=h?'HEALTHY':'DEGRADED';$('badge').style.color=h?'#5eead4':'#fb7185';$('mh').textContent=h?'OK':'FAIL';$('mw').textContent=r.d.watchdog?.timedOut?'TIMEOUT':'LIVE';$('mq').textContent=r.d.execution?.queued||0;$('estop').textContent=r.d.emergencyStopped?'E-STOP':'READY';$('estop').style.color=r.d.emergencyStopped?'#fb7185':'#5eead4';if(full)$('badge').textContent=h?'HEALTHY':'DEGRADED';}
async function state(){const r=await api('/robot/state');if(r.ok&&r.d.positions){joints=r.d.positions.slice(0,6).map(Number);sliders();}}
async function cmd(js){return api('/robot/command','POST',{type:'robot.motion',skillId:'manual_control',joints:js.map(Number),velocityRadS:+$('vel').value,accelerationRadS2:.8,torqueNm:+$('tor').value});}
async function sendManual(){const r=await cmd(joints);show('goalOut',r.d);setTimeout(state,80);refresh();}
async function homePose(){joints=[0,0,0,0,0,0];sliders();await sendManual();}
async function demoPose(){joints=[.4,-.7,1.1,.2,.3,0];sliders();await sendManual();}
async function stopAll(){const r=await api('/emergency-stop','POST');msg(`急停：${r.d.stopped}`,'s');refresh();}
async function kick(){await api('/watchdog/kick','POST',{});refresh();}
function parse(t){t=t.toLowerCase();if(/回家|home|复位|retract/.test(t))return[0,0,0,0,0,0,'已生成安全 Home 动作。'];if(/抓取|拿|pick|grasp/.test(t))return[0,-.5,.9,0,0,0,'已生成抓取目标动作。'];if(/演示|demo|挥手/.test(t))return[.4,-.7,1.1,.2,.3,0,'已生成演示动作。'];if(/前进|forward/.test(t))return[.6,0,0,0,0,0,'已生成前进测试动作。'];if(/后退|back/.test(t))return[-.6,0,0,0,0,0,'已生成后退测试动作。'];return null;}
async function sendChat(){const text=$('chatInput').value.trim();if(!text)return;msg(text,'u');$('chatInput').value='';const r=await api('/ai/chat','POST',{message:text});
 if(r.ok&&r.d.mode==='safe_command'){const p=r.d.robotState?.positions||[];msg(`${r.d.reply}\n执行状态：${r.d.execution?.ok===false?'被安全层拦截':'已提交成功'}\n命令ID：${r.d.execution?.commandId||'-'}\n实时关节：[${p.map(v=>Number(v).toFixed(2)).join(', ')}]`);joints=p.slice(0,6).map(Number);render();sliders();}else if(r.ok){msg(r.d.content+'\n\n注意：这是 AI 文本回复，不是真实机器人执行结果。');}else{msg(`执行失败：${r.d.error||'未知错误'}`);}refresh();}
async function configureAI(){const r=await api('/ai/configure','POST',{apiKey:$('apiKey').value,modelId:$('modelId').value,baseUrl:$('localBaseUrl').value.trim()});show('aiOut',r.d);msg(r.ok?`AI 已配置：${r.d.modelId}`:`配置失败：${r.d.error}`,'s');}
async function resetAI(){const r=await api('/ai/reset','POST');show('aiOut',r.d);msg('AI 服务端上下文已清空。','s');}
async function resetSafety(){const r=await api('/safety/reset','POST',{authorizationToken:$('resetToken').value});msg(r.ok?'安全状态与后端已恢复。':`恢复失败：${r.d.error}`,'s');refresh();}
async function runGoal(){const r=await api('/goal','POST',{text:$('goalText').value});show('goalOut',r.d);setTimeout(state,100);refresh();}
function post(path,bodyId,outId){api(path,'POST',JSON.parse($(bodyId).value)).then(r=>show(outId,r.d)).then(refresh);}
function show(id,o){$(id).textContent=JSON.stringify(o,null,2);}
sliders();state();refresh();setInterval(()=>{refresh();if(!$('estop').textContent.includes('E'))state();},1800);
</script></body></html>
