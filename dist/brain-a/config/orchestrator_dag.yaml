transient:
  NEW_ROOM_EXPLORATION: [gush3r]
  TASK_PLANNING: [dreamzero]
  IMAGINATION: [dreamzero]

edges:
  - { from: CONVERSATION, to: MANIPULATION, cost: 0.8 }
  - { from: CONVERSATION, to: VISION_INSPECTION, cost: 0.6 }
  - { from: CONVERSATION, to: TASK_PLANNING, cost: 0.5 }
  - { from: VISION_INSPECTION, to: MANIPULATION, cost: 0.7 }
  - { from: MANIPULATION, to: IMAGINATION, cost: 0.4 }
