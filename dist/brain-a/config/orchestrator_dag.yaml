  - id: groot_motor
    backend: groot
    gpu: 1
    pinned: true
    qos: P0
  - id: gush3r
    backend: gush3r
    gpu: 1
    pinned: false
    qos: P2
  - id: dreamzero
    backend: dreamdojo
    gpu: 1
    pinned: false
    qos: P2
  - id: whisper
    backend: whisper
    gpu: 0
    pinned: true
