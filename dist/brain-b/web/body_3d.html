<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>🧠 球形智能体 · 身体设计图</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; }
  #canvas { display:block; width:100vw; height:100vh; }

  /* 控制面板 */
  #panel {
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    background:rgba(10,10,30,0.85); backdrop-filter:blur(12px);
    border:1px solid rgba(100,180,255,0.2); border-radius:16px;
    padding:16px 28px; display:flex; gap:20px; align-items:center;
    z-index:10; font-size:13px;
  }
  #panel .sense { display:flex; align-items:center; gap:6px; cursor:pointer; padding:4px 10px; border-radius:8px; transition:all 0.3s; }
  #panel .sense:hover { background:rgba(100,180,255,0.15); }
  #panel .sense .dot { width:10px; height:10px; border-radius:50%; }
  #panel .sense .label { opacity:0.7; }
  .dot.eye{background:#00ddff} .dot.ear{background:#ff8800} .dot.tongue{background:#ff4488}
  .dot.nose{background:#44ff88} .dot.skin{background:#ffdd00}

  #title {
    position:fixed; top:24px; left:50%; transform:translateX(-50%);
    font-size:20px; font-weight:300; letter-spacing:2px;
    background:rgba(10,10,30,0.6); backdrop-filter:blur(8px);
    padding:10px 24px; border-radius:30px;
    border:1px solid rgba(100,180,255,0.15);
    z-index:10; white-space:nowrap;
  }
  #title strong { color:#66ddff; font-weight:600; }
  #title .ver { font-size:11px; opacity:0.4; margin-left:8px; }

  #info {
    position:fixed; top:80px; right:24px;
    background:rgba(10,10,30,0.7); backdrop-filter:blur(8px);
    border:1px solid rgba(100,180,255,0.12); border-radius:12px;
    padding:14px 18px; font-size:12px; line-height:1.7;
    z-index:10; min-width:140px; opacity:0.8;
  }
  #info span { opacity:0.5; }
  @media(max-width:768px) { #panel { flex-wrap:wrap; justify-content:center; gap:8px; padding:12px 16px; } #title{font-size:14px; padding:6px 14px;} #info{display:none;} }
</style>
</head>
<body>

<div id="title">
  🟣 <strong>球形智能体</strong>  ·  人体五官架构
  <span class="ver">v2.0</span>
</div>

<div id="info">
  <div style="color:#66ddff">🧠 19 个脑区</div>
  <div>👁 视觉 · 👂 听觉 · 👅 味觉</div>
  <div>👃 嗅觉 · ✋ 触觉</div>
  <div style="margin-top:4px;opacity:0.4"><span>拖拽旋转 · 滚轮缩放</span></div>
</div>

<div id="panel">
  <div class="sense" onclick="toggleSense('eye')"><span class="dot eye"></span><span class="label">👁 视觉</span></div>
  <div class="sense" onclick="toggleSense('ear')"><span class="dot ear"></span><span class="label">👂 听觉</span></div>
  <div class="sense" onclick="toggleSense('tongue')"><span class="dot tongue"></span><span class="label">👅 味觉</span></div>
  <div class="sense" onclick="toggleSense('nose')"><span class="dot nose"></span><span class="label">👃 嗅觉</span></div>
  <div class="sense" onclick="toggleSense('skin')"><span class="dot skin"></span><span class="label">✋ 触觉</span></div>
</div>

<div id="canvas"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ─── 场景 ───
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(4.5, 3, 6);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.getElementById('canvas').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.getElementById('canvas').appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 2.5;
controls.maxDistance = 15;

// ─── 灯光 ───
const ambient = new THREE.AmbientLight(0x334466, 0.5);
scene.add(ambient);
const key = new THREE.DirectionalLight(0x88ccff, 2);
key.position.set(5, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0xff8844, 0.6);
fill.position.set(-5, 2, -4);
scene.add(fill);
const rim = new THREE.DirectionalLight(0x4488ff, 0.8);
rim.position.set(-3, -4, 5);
scene.add(rim);

// ─── 星空背景 ───
const stars = new THREE.BufferGeometry();
const stPos = [];
for(let i=0; i<2000; i++) stPos.push((Math.random()-0.5)*80, (Math.random()-0.5)*80, (Math.random()-0.5)*80);
stars.setAttribute('position', new THREE.Float32BufferAttribute(stPos, 3));
scene.add(new THREE.Points(stars, new THREE.PointsMaterial({ color:0x4488ff, size:0.06, transparent:true, opacity:0.6 })));

// ─── 地面小圆环 ───
const ring = new THREE.Mesh(
  new THREE.RingGeometry(2.0, 2.3, 80),
  new THREE.MeshBasicMaterial({ color:0x4488ff, transparent:true, opacity:0.08, side:THREE.DoubleSide, depthWrite:false })
);
ring.rotation.x = -Math.PI/2;
ring.position.y = -1.7;
scene.add(ring);

// ─── 主球体（透明） ───
const sphereGeo = new THREE.SphereGeometry(1.6, 64, 64);
const sphereMat = new THREE.MeshPhysicalMaterial({
  color: 0x88ccff,
  metalness: 0.05,
  roughness: 0.1,
  transparent: true,
  opacity: 0.15,
  clearcoat: 0.6,
  clearcoatRoughness: 0.3,
  envMapIntensity: 0.5,
  side: THREE.DoubleSide,
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
scene.add(sphere);

// 球体线框
const wireGeo = new THREE.SphereGeometry(1.605, 32, 24);
const wireMat = new THREE.MeshBasicMaterial({
  color: 0x4488ff, wireframe:true, transparent:true, opacity:0.08
});
scene.add(new THREE.Mesh(wireGeo, wireMat));

// 内发光
const glowGeo = new THREE.SphereGeometry(1.55, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0x4488ff, transparent:true, opacity:0.04, side:THREE.BackSide
});
scene.add(new THREE.Mesh(glowGeo, glowMat));

// ─── 脑区节点（球体内部） ───
const brainNodes = [
  { name:'脑干',       pos:[0, -0.95, 0],       color:'#ff4444', size:0.10 },
  { name:'丘脑',       pos:[0, -0.4, 0.5],      color:'#ff8800', size:0.09 },
  { name:'杏仁核',     pos:[0.5, -0.2, 0.3],    color:'#ff2244', size:0.07 },
  { name:'海马体',     pos:[-0.5, -0.3, 0.3],   color:'#ff66aa', size:0.08 },
  { name:'皮层',       pos:[0, 0.2, 0.8],       color:'#44aaff', size:0.11 },
  { name:'基底核',     pos:[0.6, -0.1, -0.1],   color:'#aa66ff', size:0.07 },
  { name:'奖赏系统',   pos:[-0.55, 0.1, -0.2],   color:'#ffdd44', size:0.07 },
  { name:'DMN',        pos:[-0.3, 0.6, 0.3],    color:'#66ffcc', size:0.07 },
  { name:'松果体',     pos:[0, 0.15, 0.9],      color:'#ffffff', size:0.05 },
  { name:'小脑',       pos:[0, -0.8, -0.4],     color:'#ff8844', size:0.08 },
  { name:'镜像神经元', pos:[0.7, 0.3, -0.2],    color:'#44ffaa', size:0.06 },
  { name:'内感觉',     pos:[-0.7, -0.1, -0.3],  color:'#ff66aa', size:0.06 },
  { name:'语言皮层',   pos:[0.3, 0.55, -0.4],   color:'#44ddff', size:0.08 },
  { name:'胼胝体',     pos:[0, 0, 0],           color:'#88aaff', size:0.04 },
  { name:'前额叶',     pos:[0.2, 0.7, 0.1],     color:'#66bbff', size:0.09 },
  { name:'运动皮层',   pos:[0.5, 0.4, 0.5],     color:'#ff8844', size:0.07 },
  { name:'感觉皮层',   pos:[-0.4, 0.5, 0.5],    color:'#44bb88', size:0.07 },
  { name:'知识库',     pos:[-0.2, -0.6, 0.6],   color:'#44dd88', size:0.08 },
  { name:'自我意识',   pos:[0, 0.4, -0.6],      color:'#ff66ff', size:0.09 },
];

const nodeGroup = new THREE.Group();
const connections = [];

for (const n of brainNodes) {
  const [x,y,z] = n.pos;
  const c = new THREE.Color(n.color);
  // 发光小球
  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(n.size, 16, 16),
    new THREE.MeshPhysicalMaterial({ color:c, emissive:c, emissiveIntensity:0.3, transparent:true, opacity:0.7 })
  );
  ball.position.set(x,y,z);
  nodeGroup.add(ball);
  // 外光晕
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(n.size*1.6, 16, 16),
    new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:0.08 })
  );
  halo.position.set(x,y,z);
  nodeGroup.add(halo);
  connections.push({ pos: new THREE.Vector3(x,y,z), color: c });
}

scene.add(nodeGroup);

// 脑区连接线
const lineMat = new THREE.LineBasicMaterial({ color:0x4488ff, transparent:true, opacity:0.06 });
for(let i=0; i<connections.length; i++) {
  for(let j=i+1; j<connections.length; j++) {
    const d = connections[i].pos.distanceTo(connections[j].pos);
    if(d < 1.0 && Math.random() > 0.5) {
      const g = new THREE.BufferGeometry().setFromPoints([connections[i].pos, connections[j].pos]);
      scene.add(new THREE.Line(g, lineMat));
    }
  }
}

// ─── 五官符号 ───
const senses = {};

function makeLabel(text, sub, color) {
  const div = document.createElement('div');
  div.textContent = text;
  div.style.color = '#fff';
  div.style.fontSize = '18px';
  div.style.fontWeight = '600';
  div.style.textShadow = '0 0 20px rgba(0,0,0,0.8), 0 0 8px currentColor';
  div.style.color = color;
  div.style.background = 'rgba(0,0,0,0.4)';
  div.style.backdropFilter = 'blur(4px)';
  div.style.padding = '4px 12px';
  div.style.borderRadius = '20px';
  div.style.border = '1px solid ' + color;
  div.style.fontSize = '14px';
  div.style.letterSpacing = '1px';
  if(sub) {
    const s = document.createElement('div');
    s.textContent = sub;
    s.style.fontSize = '11px';
    s.style.opacity = '0.6';
    s.style.fontWeight = '400';
    s.style.marginTop = '2px';
    div.appendChild(s);
  }
  return new CSS2DObject(div);
}

function makeOrbitRing(radius, angleOffset, color, width=0.02) {
  const curve = new THREE.EllipseCurve(0,0, radius,radius, 0, Math.PI*2, false, angleOffset);
  const pts = curve.getPoints(48);
  const g = new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(p.x, p.y, 0)));
  const ring = new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent:true, opacity:0.3 }));
  return ring;
}

function createEye() {
  const g = new THREE.Group();
  // 镜头环
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.35, 0.04, 16, 32),
    new THREE.MeshPhysicalMaterial({ color:0x00ddff, emissive:0x00ddff, emissiveIntensity:0.2, metalness:0.3, roughness:0.2 })
  );
  ring.position.z = 0.05;
  g.add(ring);
  // 镜头
  const lens = new THREE.Mesh(
    new THREE.CircleGeometry(0.28, 24),
    new THREE.MeshPhysicalMaterial({ color:0x004466, emissive:0x00ddff, emissiveIntensity:0.1, transparent:true, opacity:0.6, side:THREE.DoubleSide })
  );
  lens.position.z = 0.06;
  g.add(lens);
  // 瞳孔高光
  const pupil = new THREE.Mesh(
    new THREE.CircleGeometry(0.08, 16),
    new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.4 })
  );
  pupil.position.set(0.06, 0.06, 0.07);
  g.add(pupil);
  g.position.set(1.7, 0.2, 0);
  return g;
}

function createEar() {
  const g = new THREE.Group();
  const earShape = new THREE.Shape();
  earShape.moveTo(0, -0.15);
  earShape.quadraticCurveTo(0.25, -0.1, 0.3, 0);
  earShape.quadraticCurveTo(0.25, 0.1, 0, 0.15);
  earShape.quadraticCurveTo(-0.05, 0, 0, -0.15);
  const geo = new THREE.ShapeGeometry(earShape);
  const mat = new THREE.MeshPhysicalMaterial({ color:0xff8800, emissive:0xff8800, emissiveIntensity:0.15, transparent:true, opacity:0.7, side:THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.z = 0.05;
  g.add(mesh);
  // 声波弧线
  for(let i=0; i<3; i++) {
    const arc = new THREE.ArcCurve(0, 0, 0.18 + i*0.08, -0.6, 0.6, false);
    const pts = arc.getPoints(12);
    const lg = new THREE.BufferGeometry().setFromPoints(pts);
    const l = new THREE.Line(lg, new THREE.LineBasicMaterial({ color:0xff8800, transparent:true, opacity:0.2 - i*0.05 }));
    l.position.z = 0.06;
    g.add(l);
  }
  g.position.set(0, 0.2, 1.7);
  return g;
}

function createTongue() {
  const g = new THREE.Group();
  // 味蕾
  const buds = [];
  for(let i=0; i<5; i++) {
    const bud = new THREE.Mesh(
      new THREE.SphereGeometry(0.04, 8, 8),
      new THREE.MeshPhysicalMaterial({ color:0xff4488, emissive:0xff4488, emissiveIntensity:0.2 })
    );
    const angle = (i/5) * Math.PI - 0.8;
    bud.position.set(Math.sin(angle)*0.15, Math.cos(angle)*0.15 - 0.05, 0.05);
    g.add(bud);
  }
  // 舌形
  const shape = new THREE.Shape();
  shape.moveTo(-0.12, 0);
  shape.quadraticCurveTo(-0.15, 0.15, 0, 0.2);
  shape.quadraticCurveTo(0.15, 0.15, 0.12, 0);
  shape.quadraticCurveTo(0, -0.05, -0.12, 0);
  const geo = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshPhysicalMaterial({ color:0xff4488, transparent:true, opacity:0.3, side:THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.z = 0.02;
  g.add(mesh);
  g.position.set(-0.6, -1.5, 0.5);
  g.rotation.x = 0.3;
  return g;
}

function createNose() {
  const g = new THREE.Group();
  // 鼻孔
  for(let side of [-1,1]) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.05, 0.015, 8, 12),
      new THREE.MeshPhysicalMaterial({ color:0x44ff88, emissive:0x44ff88, emissiveIntensity:0.2 })
    );
    ring.position.set(side*0.08, 0, 0.05);
    g.add(ring);
  }
  // 气流粒子
  for(let i=0; i<6; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.008, 6, 6),
      new THREE.MeshBasicMaterial({ color:0x44ff88, transparent:true, opacity:0.5 })
    );
    p.position.set((Math.random()-0.5)*0.3, (Math.random()-0.5)*0.2, 0.1 + Math.random()*0.2);
    p.userData = { vx:(Math.random()-0.5)*0.003, vy:Math.random()*0.005, life:Math.random() };
    g.add(p);
  }
  g.position.set(0.6, -0.4, 1.5);
  return g;
}

function createSkin() {
  const g = new THREE.Group();
  // 触觉网格
  const gridHelper = new THREE.Group();
  for(let i=-2; i<=2; i++) {
    const pts = [new THREE.Vector3(i*0.08, -0.2, 0), new THREE.Vector3(i*0.08, 0.2, 0)];
    const lg = new THREE.BufferGeometry().setFromPoints(pts);
    const l = new THREE.Line(lg, new THREE.LineBasicMaterial({ color:0xffdd00, transparent:true, opacity:0.15 }));
    gridHelper.add(l);
  }
  for(let j=-2; j<=2; j++) {
    const pts = [new THREE.Vector3(-0.2, j*0.08, 0), new THREE.Vector3(0.2, j*0.08, 0)];
    const lg = new THREE.BufferGeometry().setFromPoints(pts);
    const l = new THREE.Line(lg, new THREE.LineBasicMaterial({ color:0xffdd00, transparent:true, opacity:0.15 }));
    gridHelper.add(l);
  }
  g.add(gridHelper);
  // 压力点
  for(let i=0; i<8; i++) {
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.015, 6, 6),
      new THREE.MeshBasicMaterial({ color:0xffdd00, transparent:true, opacity:0.3 })
    );
    dot.position.set((Math.random()-0.5)*0.3, (Math.random()-0.5)*0.3, 0.02);
    g.add(dot);
  }
  g.position.set(-1.5, -0.6, 0.5);
  g.rotation.y = 0.5;
  return g;
}

// 放置五官
senses.eye = createEye();    scene.add(senses.eye);
senses.ear = createEar();    scene.add(senses.ear);
senses.tongue = createTongue(); scene.add(senses.tongue);
senses.nose = createNose();  scene.add(senses.nose);
senses.skin = createSkin();  scene.add(senses.skin);

// ─── 标签 ───
const labels = [
  { text:'👁 视觉', sub:'eye · 物体检测/场景识别', pos:[1.7, 0.6, 0], color:'#00ddff' },
  { text:'👂 听觉', sub:'ear · 语音识别/声源定位', pos:[0, 0.6, 1.9], color:'#ff8800' },
  { text:'👅 味觉', sub:'tongue · 甜酸咸苦鲜', pos:[-0.8, -1.8, 0.7], color:'#ff4488' },
  { text:'👃 嗅觉', sub:'nose · 气味识别/气体检测', pos:[0.9, -0.8, 1.8], color:'#44ff88' },
  { text:'✋ 触觉', sub:'skin · 压力/温度/纹理', pos:[-1.8, -0.9, 0.7], color:'#ffdd00' },
  { text:'🧠 独立意识', sub:'19个脑区协同', pos:[0, 1.5, -0.5], color:'#ff66ff' },
  { text:'🗣 语音输出', sub:'speak · TTS合成', pos:[0, -0.3, -2.0], color:'#88aaff' },
  { text:'💡 LED表情', sub:'express · 情绪灯', pos:[-1.8, 0.6, -0.8], color:'#ff66aa' },
];
for(const l of labels) {
  const label = makeLabel(l.text, l.sub, l.color);
  label.position.set(l.pos[0], l.pos[1], l.pos[2]);
  scene.add(label);
}

// ─── 数据流粒子 ───
const flowParticles = [];
for(let i=0; i<80; i++) {
  const p = new THREE.Mesh(
    new THREE.SphereGeometry(0.015, 4, 4),
    new THREE.MeshBasicMaterial({ color:0x4488ff, transparent:true, opacity:0.4 })
  );
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  p.position.set(Math.sin(phi)*Math.cos(theta)*1.7, Math.sin(phi)*Math.sin(theta)*1.7, Math.cos(phi)*1.7);
  p.userData = { theta, phi, speed:0.002 + Math.random()*0.005 };
  scene.add(p);
  flowParticles.push(p);
}

// ─── 轨道环 ───
const orbitRings = [];
for(let i=0; i<3; i++) {
  const r = new THREE.Mesh(
    new THREE.TorusGeometry(2.0 + i*0.15, 0.003, 8, 60),
    new THREE.MeshBasicMaterial({ color:[0x4488ff, 0x88ddff, 0x66aaff][i], transparent:true, opacity:0.08 })
  );
  r.rotation.x = Math.PI/3 + i*0.2;
  r.rotation.z = i*0.3;
  scene.add(r);
  orbitRings.push(r);
}

// ─── Sense toggle ───
window.toggleSense = function(name) {
  if(senses[name]) {
    senses[name].visible = !senses[name].visible;
    // update label opacity too
  }
};

// ─── 动画 ───
let clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();

  // 自动旋转
  controls.update();

  // 脑区节点脉动
  nodeGroup.children.forEach((child, i) => {
    if(child.type === 'Mesh' && child.geometry.type === 'SphereGeometry' && child.material.emissive) {
      const scale = 1 + Math.sin(t * 0.8 + i * 0.5) * 0.05;
      child.scale.set(scale, scale, scale);
    }
  });

  // 五官动画
  const eye = senses.eye;
  if(eye && eye.visible) {
    eye.children[0].rotation.z = Math.sin(t * 0.5) * 0.05;
  }

  // 粒子流动
  for(const p of flowParticles) {
    p.userData.theta += p.userData.speed;
    const rad = 1.7 + Math.sin(t * 0.3 + p.userData.phi) * 0.05;
    p.position.x = Math.sin(p.userData.phi) * Math.cos(p.userData.theta) * rad;
    p.position.y = Math.sin(p.userData.phi) * Math.sin(p.userData.theta) * rad;
    p.position.z = Math.cos(p.userData.phi) * rad;
  }

  // 轨道环旋转
  orbitRings.forEach((r, i) => {
    r.rotation.x += 0.001 * (i+1);
    r.rotation.z += 0.0005 * (i+1);
  });

  // 球体呼吸
  sphere.material.opacity = 0.15 + Math.sin(t * 0.3) * 0.03;

  // 渲染
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

// ─── 响应式 ───
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
