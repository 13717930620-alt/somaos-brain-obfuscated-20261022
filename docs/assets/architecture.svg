<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="'Segoe UI','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b6c7d7"/>
    </marker>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8ae42"/><stop offset="100%" stop-color="#d99b2b"/>
    </linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123b53"/><stop offset="100%" stop-color="#0d2033"/>
    </linearGradient>
  </defs>

  <rect width="1240" height="780" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="21" font-weight="700" fill="#0d2033" letter-spacing="0.5">SOMAOS 云脑运行时 · 分层架构</text>
  <text x="40" y="64" font-size="11.5" fill="#6b7b8c">每层只依赖下一层；跨层回落、维度硬套、证据互相顶替，一律视为违约</text>

  <!-- ============ L1 验收与证据 ============ -->
  <rect x="40" y="86" width="1160" height="82" rx="8" fill="#f7fafc" stroke="#dbe4ee"/>
  <rect x="40" y="86" width="4" height="82" rx="2" fill="#d99b2b"/>
  <text x="60" y="118" font-size="12.5" font-weight="700" fill="#0d2033">验收</text>
  <text x="60" y="134" font-size="12.5" font-weight="700" fill="#0d2033">与证据</text>
  <text x="60" y="152" font-size="9.5" fill="#8296a8">只走公开接口</text>

  <g>
    <rect x="176" y="101" width="222" height="52" rx="6" fill="#fff" stroke="#dbe4ee"/>
    <text x="190" y="122" font-size="12" font-weight="700" fill="#0d2033">58 条黑盒用例</text>
    <text x="190" y="140" font-size="9.8" fill="#6b7b8c">6 个套件 · 不 require 内部模块</text>

    <rect x="410" y="101" width="222" height="52" rx="6" fill="#fff" stroke="#dbe4ee"/>
    <text x="424" y="122" font-size="12" font-weight="700" fill="#0d2033">3,722 条 SHA-256</text>
    <text x="424" y="140" font-size="9.8" fill="#6b7b8c">全仓逐文件校验和</text>

    <rect x="644" y="101" width="222" height="52" rx="6" fill="#fff" stroke="#dbe4ee"/>
    <text x="658" y="122" font-size="12" font-weight="700" fill="#0d2033">ABI 自检</text>
    <text x="658" y="140" font-size="9.8" fill="#6b7b8c">V8 13.6.233.17-node.48</text>

    <rect x="878" y="101" width="304" height="52" rx="6" fill="#fff" stroke="#dbe4ee"/>
    <text x="892" y="122" font-size="12" font-weight="700" fill="#0d2033">6 条突变证伪</text>
    <text x="892" y="140" font-size="9.8" fill="#6b7b8c">改坏必须变红，同文件其余用例仍绿</text>
  </g>

  <line x1="680" y1="170" x2="680" y2="182" stroke="#b6c7d7" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ L2 模型中心 ============ -->
  <rect x="40" y="186" width="1160" height="152" rx="8" fill="#f7fafc" stroke="#dbe4ee"/>
  <rect x="40" y="186" width="4" height="152" rx="2" fill="#1f7a8c"/>
  <text x="60" y="246" font-size="12.5" font-weight="700" fill="#0d2033">模型中心</text>
  <text x="60" y="262" font-size="12.5" font-weight="700" fill="#0d2033">三层</text>
  <text x="60" y="280" font-size="9.5" fill="#8296a8">64 个模块</text>

  <g>
    <rect x="176" y="198" width="1008" height="40" rx="6" fill="#fff" stroke="#cfe0ea"/>
    <rect x="176" y="198" width="4" height="40" rx="2" fill="#1f7a8c"/>
    <text x="192" y="216" font-size="11.5" font-weight="700" fill="#0d2033">③ 门面  center-facade</text>
    <text x="192" y="231" font-size="9.8" fill="#6b7b8c">单一入口 · capability_overview · degraded 显式上报 · forbidRootMerge</text>
    <text x="1168" y="223" font-size="9.5" fill="#1f7a8c" text-anchor="end" font-weight="600">12 模块</text>

    <rect x="176" y="246" width="1008" height="40" rx="6" fill="#fff" stroke="#cfe0ea"/>
    <rect x="176" y="246" width="4" height="40" rx="2" fill="#1f7a8c"/>
    <text x="192" y="264" font-size="11.5" font-weight="700" fill="#0d2033">② 运行  center-runtime</text>
    <text x="192" y="279" font-size="9.8" fill="#6b7b8c">传输抽象 · 安全三道门（速率 / 看门狗 / 复位令牌） · 不产生关节目标</text>
    <text x="1168" y="271" font-size="9.5" fill="#1f7a8c" text-anchor="end" font-weight="600">25 模块</text>

    <rect x="176" y="294" width="1008" height="40" rx="6" fill="#fff" stroke="#cfe0ea"/>
    <rect x="176" y="294" width="4" height="40" rx="2" fill="#1f7a8c"/>
    <text x="192" y="312" font-size="11.5" font-weight="700" fill="#0d2033">① 契约  center-contract</text>
    <text x="192" y="327" font-size="9.8" fill="#6b7b8c">manifest / verdict / roots 三契约 · 只声明维度，不做判定 · 适配器只做字段映射</text>
    <text x="1168" y="319" font-size="9.5" fill="#1f7a8c" text-anchor="end" font-weight="600">27 模块</text>
  </g>

  <line x1="680" y1="338" x2="680" y2="350" stroke="#b6c7d7" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ L3 公共底座 ============ -->
  <rect x="40" y="354" width="1160" height="98" rx="8" fill="#f7fafc" stroke="#dbe4ee"/>
  <rect x="40" y="354" width="4" height="98" rx="2" fill="#2f6d4f"/>
  <text x="60" y="396" font-size="12.5" font-weight="700" fill="#0d2033">公共底座</text>
  <text x="60" y="412" font-size="12.5" font-weight="700" fill="#0d2033">三大</text>
  <text x="60" y="430" font-size="9.5" fill="#8296a8">只被调用</text>

  <g>
    <rect x="176" y="368" width="330" height="70" rx="6" fill="#fff" stroke="#dbe4ee"/>
    <text x="192" y="390" font-size="11.5" font-weight="700" fill="#0d2033">base-core　公共核心</text>
    <text x="192" y="408" font-size="9.8" fill="#6b7b8c">规格 schema · 注册表 · 证据核心 · 代码根</text>
    <text x="192" y="424" font-size="9.8" fill="#6b7b8c">20 文件 · 9 .jsc</text>

    <rect x="518" y="368" width="330" height="70" rx="6" fill="#fff" stroke="#dbe4ee"/>
    <text x="534" y="390" font-size="11.5" font-weight="700" fill="#0d2033">base-bio　仿生脑底座</text>
    <text x="534" y="408" font-size="9.8" fill="#6b7b8c">Profile 存储 · 大脑蓝图 · 控制器判定 · LLM 连接</text>
    <text x="534" y="424" font-size="9.8" fill="#6b7b8c">44 文件 · 14 .jsc</text>

    <rect x="860" y="368" width="324" height="70" rx="6" fill="#fff" stroke="#dbe4ee"/>
    <text x="876" y="390" font-size="11.5" font-weight="700" fill="#0d2033">base-motion　运动底座</text>
    <text x="876" y="408" font-size="9.8" fill="#6b7b8c">规格摄入 · 控制器解析 · 工件账本</text>
    <text x="876" y="424" font-size="9.8" fill="#6b7b8c">25 文件 · 8 .jsc</text>
  </g>

  <line x1="680" y1="454" x2="680" y2="466" stroke="#b6c7d7" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ L4 四棵工程树 ============ -->
  <rect x="40" y="470" width="1160" height="152" rx="8" fill="#f7fafc" stroke="#dbe4ee"/>
  <rect x="40" y="470" width="4" height="152" rx="2" fill="#0d2033"/>
  <text x="60" y="530" font-size="12.5" font-weight="700" fill="#0d2033">四棵</text>
  <text x="60" y="546" font-size="12.5" font-weight="700" fill="#0d2033">工程树</text>
  <text x="60" y="564" font-size="9.5" fill="#8296a8">独立构建</text>

  <g>
    <rect x="176" y="484" width="244" height="124" rx="6" fill="#fff" stroke="#dbe4ee"/>
    <rect x="176" y="484" width="244" height="24" rx="6" fill="url(#gNavy)"/>
    <text x="188" y="500" font-size="10.5" font-weight="700" fill="#ffffff">brain-a　仿生脑 A · 最新</text>
    <text x="190" y="526" font-size="9.6" fill="#42586c">20 个解剖学脑区模块</text>
    <text x="190" y="542" font-size="9.6" fill="#42586c">230 个服务模块</text>
    <text x="190" y="558" font-size="9.6" fill="#42586c">全局工作空间 · 快慢双通路</text>
    <text x="190" y="578" font-size="9.4" fill="#8296a8">1,615 文件 · 524 .jsc · 413 .pyc</text>
    <text x="190" y="596" font-size="9.4" fill="#1f7a8c" font-weight="600">22.15 MB</text>

    <rect x="431" y="484" width="244" height="124" rx="6" fill="#fff" stroke="#dbe4ee"/>
    <rect x="431" y="484" width="244" height="24" rx="6" fill="url(#gNavy)"/>
    <text x="443" y="500" font-size="10.5" font-weight="700" fill="#ffffff">brain-b　仿生脑 B · 训练完</text>
    <text x="445" y="526" font-size="9.6" fill="#42586c">同源旧版，保留可对照</text>
    <text x="445" y="542" font-size="9.6" fill="#42586c">与 A 树结构同构</text>
    <text x="445" y="558" font-size="9.6" fill="#42586c">A/B 双闸门验收对象</text>
    <text x="445" y="578" font-size="9.4" fill="#8296a8">1,527 文件 · 486 .jsc · 409 .pyc</text>
    <text x="445" y="596" font-size="9.4" fill="#1f7a8c" font-weight="600">20.60 MB</text>

    <rect x="686" y="484" width="244" height="124" rx="6" fill="#fff" stroke="#dbe4ee"/>
    <rect x="686" y="484" width="244" height="24" rx="6" fill="url(#gAmber)"/>
    <text x="698" y="500" font-size="10.5" font-weight="700" fill="#ffffff">arm-c　机械臂 · 7-DoF</text>
    <text x="700" y="526" font-size="9.6" fill="#42586c">运动全栈：认知 → 规划 → 执行</text>
    <text x="700" y="542" font-size="9.6" fill="#42586c">ActionFilter 九类违规码</text>
    <text x="700" y="558" font-size="9.6" fill="#42586c">ROS2 传输 · Mock 后端</text>
    <text x="700" y="578" font-size="9.4" fill="#8296a8">202 文件 · 65 .jsc · 45 .pyc</text>
    <text x="700" y="596" font-size="9.4" fill="#b8821f" font-weight="600">1.97 MB</text>

    <rect x="941" y="484" width="244" height="124" rx="6" fill="#fff" stroke="#dbe4ee"/>
    <rect x="941" y="484" width="244" height="24" rx="6" fill="url(#gAmber)"/>
    <text x="953" y="500" font-size="10.5" font-weight="700" fill="#ffffff">humanoid-d　人形 · 24-DoF</text>
    <text x="955" y="526" font-size="9.6" fill="#42586c">与 C 同构，关节表独立</text>
    <text x="955" y="542" font-size="9.6" fill="#42586c">24-DoF 世界模型</text>
    <text x="955" y="558" font-size="9.6" fill="#42586c">7/24/29 维限位不得混用</text>
    <text x="955" y="578" font-size="9.4" fill="#8296a8">207 文件 · 68 .jsc · 45 .pyc</text>
    <text x="955" y="596" font-size="9.4" fill="#b8821f" font-weight="600">2.02 MB</text>
  </g>

  <line x1="680" y1="622" x2="680" y2="634" stroke="#b6c7d7" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ L5 本体 ============ -->
  <rect x="40" y="638" width="1160" height="84" rx="8" fill="#f7fafc" stroke="#dbe4ee"/>
  <rect x="40" y="638" width="4" height="84" rx="2" fill="#7a8b9c"/>
  <text x="60" y="672" font-size="12.5" font-weight="700" fill="#0d2033">本体</text>
  <text x="60" y="688" font-size="12.5" font-weight="700" fill="#0d2033">Profile</text>
  <text x="60" y="706" font-size="9.5" fill="#8296a8">7 台已注册</text>

  <g font-size="9.6">
    <rect x="176" y="654" width="138" height="52" rx="5" fill="#fff" stroke="#dbe4ee"/>
    <text x="245" y="675" font-size="9.8" font-weight="600" fill="#0d2033" text-anchor="middle">Franka Panda</text>
    <text x="245" y="691" font-size="9" fill="#8296a8" text-anchor="middle">arm · 7 DoF</text>

    <rect x="321" y="654" width="138" height="52" rx="5" fill="#fff" stroke="#dbe4ee"/>
    <text x="390" y="675" font-size="9.8" font-weight="600" fill="#0d2033" text-anchor="middle">Franka DROID</text>
    <text x="390" y="691" font-size="9" fill="#8296a8" text-anchor="middle">arm · 7 DoF</text>

    <rect x="466" y="654" width="138" height="52" rx="5" fill="#fff" stroke="#dbe4ee"/>
    <text x="535" y="675" font-size="9.8" font-weight="600" fill="#0d2033" text-anchor="middle">Kinova Gen3</text>
    <text x="535" y="691" font-size="9" fill="#8296a8" text-anchor="middle">arm · 7 DoF</text>

    <rect x="611" y="654" width="138" height="52" rx="5" fill="#fff" stroke="#dbe4ee"/>
    <text x="680" y="675" font-size="9.8" font-weight="600" fill="#0d2033" text-anchor="middle">UR5</text>
    <text x="680" y="691" font-size="9" fill="#8296a8" text-anchor="middle">arm · 6 DoF</text>

    <rect x="756" y="654" width="138" height="52" rx="5" fill="#fff" stroke="#dbe4ee"/>
    <text x="825" y="675" font-size="9.8" font-weight="600" fill="#0d2033" text-anchor="middle">UR5 (6-DoF)</text>
    <text x="825" y="691" font-size="9" fill="#8296a8" text-anchor="middle">arm · 6 DoF</text>

    <rect x="901" y="654" width="138" height="52" rx="5" fill="#fff" stroke="#dbe4ee"/>
    <text x="970" y="675" font-size="9.8" font-weight="600" fill="#0d2033" text-anchor="middle">SO-100</text>
    <text x="970" y="691" font-size="9" fill="#8296a8" text-anchor="middle">arm · 6 DoF</text>

    <rect x="1046" y="654" width="138" height="52" rx="5" fill="#fff" stroke="#dbe4ee"/>
    <text x="1115" y="675" font-size="9.8" font-weight="600" fill="#0d2033" text-anchor="middle">Unitree G1</text>
    <text x="1115" y="691" font-size="9" fill="#8296a8" text-anchor="middle">humanoid · 29 DoF</text>
  </g>

  <!-- footer note -->
  <text x="40" y="748" font-size="9.6" fill="#8296a8">注：运动树结构性不回落规格根；维度不匹配必须拒绝而非硬套；两个 overall 作用域不同，禁止合并成单一档位。</text>
  <text x="1200" y="748" font-size="9.6" fill="#b0becc" text-anchor="end">SOMAOS · 2026</text>
</svg>
